name: HackiOS Ace 5 kernel (Linux ARM64)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'jobs'
        required: false
        default: ''

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget xz-utils \
            clang-18 lld-18 llvm-18 \
            flex bison m4 perl autoconf automake libtool pkg-config \
            libncurses-dev python3 python3-venv python3-pip \
            meson ninja-build nasm uuid-dev libssl-dev
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-18   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          clang --version
          dsymutil-18 --version | head -1

      - name: Install Theos toolchain and SDK
        run: |
          set -euo pipefail
          export THEOS="$PWD/local/theos"
          mkdir -p "$THEOS/toolchain"

          TOOLCHAIN=/tmp/ios-toolchain-arm64.tar.xz
          URL_REL="https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-aarch64.tar.xz"
          URL_API="https://api.github.com/repos/L1ghtmann/llvm-project/releases/assets/124872377"

          fetch() {
            echo "== trying $1"
            curl -fL --retry 6 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --max-time 900 \
                 -H 'Accept: application/octet-stream' \
                 --no-progress-meter -o "$TOOLCHAIN" "$1"
          }

          ok=0
          for attempt in 1 2 3; do
            if fetch "$URL_REL" && xz -t "$TOOLCHAIN" 2>/dev/null; then ok=1; break; fi
            echo "== release URL failed (attempt $attempt), trying API asset"
            if fetch "$URL_API" && xz -t "$TOOLCHAIN" 2>/dev/null; then ok=1; break; fi
            echo "== API asset failed (attempt $attempt), waiting"
            sleep $((attempt * 20))
          done
          if [ "$ok" != 1 ]; then
            echo "== falling back to wget"
            rm -f "$TOOLCHAIN"
            wget -q --tries=5 --timeout=60 -O "$TOOLCHAIN" "$URL_REL"
            xz -t "$TOOLCHAIN"
          fi

          ls -lh "$TOOLCHAIN"
          tar -xJf "$TOOLCHAIN" -C "$THEOS/toolchain"
          rm -f "$TOOLCHAIN"

          git clone --no-checkout https://github.com/theos/sdks.git "$THEOS/sdks"
          git -C "$THEOS/sdks" checkout --detach 0222fd5413cf4b9af096f37b4621afa2688572f7

          test -x "$THEOS/toolchain/linux/iphone/bin/ld"
          test -x "$THEOS/toolchain/linux/iphone/bin/ldid"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "Theos ready: $THEOS"

      - name: Stage 1 - sources, host tools, SDK
        run: bash xnu-deps/setup.sh --stage1

      - name: Apply Apple XNU + HackiOS patches
        run: bash xnu/apply.sh

      - name: Stage 2 - firehose and pthread libraries
        run: bash xnu-deps/setup.sh --stage2

      - name: Build kernel
        run: |
          set -o pipefail
          JOBS="${{ inputs.jobs }}"
          [ -n "$JOBS" ] || JOBS="$(nproc)"
          ./xnu-build.sh -j"$JOBS" build 2>&1 | tee xnu-build.log

      - name: Collect kernel
        run: |
          set -euo pipefail
          mkdir -p out
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if [ -f "$K" ]; then cp "$K" out/mach.ace5-public; else
            echo 'expected path missing; searching'
            find xnu-src -type f -name 'mach.development*' -exec cp {} out/ \;
          fi
          ls -lh out; sha256sum out/* || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hackios-kernel
          if-no-files-found: warn
          path: |
            out/
            xnu-build.log
            xnu-deps/*.log
          retention-days: 14
