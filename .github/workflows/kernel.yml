name: HackiOS Ace 5 kernel (Linux ARM64)

on:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'jobs'
        required: false
        default: ''

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc 2>/dev/null || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git curl wget xz-utils \
            clang-18 lld-18 llvm-18 \
            flex bison m4 perl autoconf automake libtool pkg-config \
            libncurses-dev python3 python3-venv python3-pip \
            meson ninja-build nasm uuid-dev libssl-dev
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-18   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          clang --version
          dsymutil-18 --version | head -1

      - name: Install Theos toolchain
        run: |
          set -euo pipefail
          export THEOS="$PWD/local/theos"
          mkdir -p "$THEOS/toolchain"

          TOOLCHAIN=/tmp/ios-toolchain-arm64.tar.xz
          URL_REL="https://github.com/L1ghtmann/llvm-project/releases/download/test-210562a/iOSToolchain-aarch64.tar.xz"
          URL_API="https://api.github.com/repos/L1ghtmann/llvm-project/releases/assets/124872377"

          fetch() {
            echo "== trying $1"
            curl -fL --retry 6 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 30 --max-time 900 \
                 -H 'Accept: application/octet-stream' \
                 --no-progress-meter -o "$TOOLCHAIN" "$1"
          }

          ok=0
          for attempt in 1 2 3; do
            if fetch "$URL_REL" && xz -t "$TOOLCHAIN" 2>/dev/null; then ok=1; break; fi
            echo "== release URL failed (attempt $attempt)"
            if fetch "$URL_API" && xz -t "$TOOLCHAIN" 2>/dev/null; then ok=1; break; fi
            echo "== API asset failed (attempt $attempt), waiting"
            sleep $((attempt * 20))
          done
          if [ "$ok" != 1 ]; then
            echo "== falling back to wget"
            rm -f "$TOOLCHAIN"
            wget -q --tries=5 --timeout=60 -O "$TOOLCHAIN" "$URL_REL"
            xz -t "$TOOLCHAIN"
          fi
          ls -lh "$TOOLCHAIN"

          echo "=== extracting to a scratch dir to discover the layout ==="
          rm -rf /tmp/tc && mkdir -p /tmp/tc
          tar -xJf "$TOOLCHAIN" -C /tmp/tc
          find /tmp/tc -maxdepth 4 | head -40

          LD=$(find /tmp/tc -type f -name ld -path '*linux/iphone/bin/*' | head -1)
          if [ -z "$LD" ]; then
            echo "!! no linux/iphone/bin/ld in the archive; every 'ld' found:"
            find /tmp/tc -type f -name 'ld*' | head -20
            exit 1
          fi
          SRC=$(cd "$(dirname "$LD")/../../.." && pwd)
          echo "== toolchain root inside archive: $SRC"
          cp -a "$SRC"/. "$THEOS/toolchain"/
          rm -rf /tmp/tc "$TOOLCHAIN"

          test -x "$THEOS/toolchain/linux/iphone/bin/ld" \
            || { echo "!! ld still missing after copy"; ls -R "$THEOS/toolchain" | head -60; exit 1; }
          echo "== ld OK"
          ls "$THEOS/toolchain/linux/iphone/bin"
