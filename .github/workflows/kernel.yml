name: HackiOS Ace 5 kernel

on:
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget xz-utils clang-18 lld-18 llvm-18 flex bison m4 perl autoconf automake libtool pkg-config libncurses-dev python3 python3-venv python3-pip meson ninja-build nasm uuid-dev libssl-dev
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h / | tail -1

      - name: theos-toolchain
        run: |
          set -ex
          THEOS=$PWD/local/theos
          mkdir -p "$THEOS/toolchain"
          curl -fL --retry 6 --retry-delay 5 --retry-all-errors -H "Accept: application/octet-stream" -o /tmp/tc.tar.xz https://api.github.com/repos/L1ghtmann/llvm-project/releases/assets/124872377
          xz -t /tmp/tc.tar.xz
          tar -xJf /tmp/tc.tar.xz -C "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -20
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: theos-sdk
        run: |
          set -ex
          git clone --filter=blob:none --sparse --depth 1 https://github.com/theos/sdks.git "$THEOS/sdks"
          cd "$THEOS/sdks"
          git sparse-checkout set iPhoneOS16.5.sdk
          ls "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" | head -20

      - name: macos-sdk
        run: |
          set -ex
          mkdir -p xnu-deps
          cd xnu-deps
          curl -fL --retry 6 --retry-delay 5 --retry-all-errors -H "Accept: application/octet-stream" -o sdk.tar.xz https://api.github.com/repos/joseluisq/macosx-sdks/releases/assets/122062330
          echo "518e35eae6039b3f64e8025f4525c1c43786cc5cf39459d609852faf091e34be  sdk.tar.xz" | sha256sum -c -
          tar -xJf sdk.tar.xz --wildcards "*MacOSX13.3.sdk/System/Library/Frameworks/Kernel.framework*"
          rm -f sdk.tar.xz
          ls MacOSX13.3.sdk/System/Library/Frameworks/Kernel.framework/Headers | head -20

      - name: stage1
        run: bash xnu-deps/setup.sh --stage1

      - name: apply-xnu
        run: bash xnu/apply.sh

      - name: stage2
        run: bash xnu-deps/setup.sh --stage2

      - name: build
        run: ./xnu-build.sh -j4 build 2>&1 | tee xnu-build.log

      - name: collect
        run: |
          mkdir -p out
          find xnu-src -type f -name "mach.development*" -exec cp {} out/ \;
          ls -lh out
          sha256sum out/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hackios-kernel
          path: |
            out/
            xnu-build.log
          retention-days: 14
